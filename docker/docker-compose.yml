version: "3.9"

services:
  spark:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: spark-lakehouse:dev
    container_name: spark-lakehouse
    tty: true
    stdin_open: true
    environment:
      - APP_ENV=dev
      - S3_BUCKET=lakehouse-assurance-moto-dev
      - GLUE_DB_NAME=lakehouse_assurance_moto_catalog
      - DATA_BASE_PATH=/opt/lakehouse/data
    env_file:
      - ../.env
    volumes:
      - ../src:/opt/lakehouse/src
      - ../config:/opt/lakehouse/config:ro
      - lakehouse_data:/opt/lakehouse/data
    depends_on:
      - data_init
    
    ports:
      - "4040:4040"   # Spark UI
      - "8888:8888"   # Jupyter
      - "18080:18080" # Spark History Server
      
    command: tail -f /dev/null

  data_init:
    image: alpine
    volumes:
      - ../data:/tmp/data:ro
      - lakehouse_data:/opt/lakehouse/data
    entrypoint: ["sh", "-c", "cp -rn /tmp/data/* /opt/lakehouse/data/ || true"]
    restart: "no"

volumes:
  lakehouse_data:
    driver: local
